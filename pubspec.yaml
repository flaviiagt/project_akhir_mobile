name: studytrip
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Anggota 1 (auth, profil, biometrik)
  http: ^1.2.2
  http_parser: ^4.1.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  # Anggota 2 (checklist, itinerary, catatan, quiz, notifikasi)
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
  sqflite: ^2.4.4+2
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  intl: ^0.20.3
  # dipakai bersama
  google_fonts: ^6.3.2
  supabase_flutter: ^2.18.3
  # Anggota 3 (anggaran, alat, eksplorasi, StudyBuddy AI)
  flutter_map: 8.3.2
  latlong2: 0.10.1
  sensors_plus: 7.1.1
  google_generative_ai: 0.4.7
  geolocator: ^14.0.2
  crypto: ^3.0.6
  encrypt: ^5.0.3
  web3dart: ^2.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.4.4 # hanya untuk pengujian (test/budget_test.dart)

flutter:
  uses-material-design: true
  assets:
    - assets/universities/
