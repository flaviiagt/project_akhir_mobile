version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Anggota 1 (auth, profil, biometrik)
  http: ^1.2.2
  http_parser: ^4.1.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
